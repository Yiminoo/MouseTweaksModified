name: Java CI with Gradle

on:
  push:
    paths-ignore:
      - '*.md'
      - '*.txt'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*.txt'
  workflow_dispatch:

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 25

      - name: Build (NeoForge)
        run: ./gradlew -p neoforge build

      - uses: actions/upload-artifact@v6
        with:
          name: MouseTweaks-NeoForge
          path: neoforge/build/libs/
          if-no-files-found: error

      - name: Test datagen
        run: ./gradlew -p neoforge runClientData
